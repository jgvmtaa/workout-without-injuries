name: Android CI

# Scoped to the `cfg` branch only: this workflow file lives on `cfg`, and these
# triggers restrict runs to pushes to `cfg` and PRs targeting `cfg`. It does not
# affect `main` (the file isn't there until merged) or any other branch.
on:
  push:
    branches: [ cfg ]
  pull_request:
    branches: [ cfg ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
