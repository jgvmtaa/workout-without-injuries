name: CI

# The build gate docs/toolchain.md refers to. It exists because a Gradle build
# cannot be run from every environment this project is developed in (see the
# environment caveat in that file), so "it compiles" needs somewhere neutral to
# be proven.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the in-flight run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Supplies the JVM that Gradle and AGP run on (AGP 8.7.3 requires 17+), and
          # satisfies the jvmToolchain(17) in app/build.gradle.kts. Deliberately a
          # floating major: this takes the newest 17.x at run time so security patches
          # land without a repo change, which means it is not patch-identical to a
          # developer's local JDK. Pin the full version here if that ever matters.
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write the dependency/build cache from the default branch, so a PR
          # cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore
