# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build in parallel where possible.
org.gradle.parallel=true

# Cache task outputs across builds.
org.gradle.caching=true

# AndroidX (required; support library is deprecated).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only package the resources actually referenced (smaller builds).
android.nonTransitiveRClass=true
