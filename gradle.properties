# Project-wide Gradle settings.

# JVM args for the Gradle daemon. 4g rather than the old 2g: KSP, Hilt code
# generation and the Compose compiler run in this JVM and 2g makes them thrash.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Build in parallel where possible. (No effect on a single-module build; kept so it
# is already right if the project is ever split.)
org.gradle.parallel=true

# Cache task outputs across builds.
org.gradle.caching=true

# Reuse the configuration phase across builds — the largest local build-time win
# available on AGP 8.7 + Kotlin 2.0. If a plugin turns out not to support it, the
# failure names the plugin; set this to false to unblock and file the incompatibility.
org.gradle.configuration-cache=true

# AndroidX (required; support library is deprecated).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only package the resources actually referenced (smaller builds).
android.nonTransitiveRClass=true
